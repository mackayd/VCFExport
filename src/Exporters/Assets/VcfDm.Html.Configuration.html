      <section id="view-virtual" class="view" aria-labelledby="virtual-title">
        <h2 id="virtual-title">Virtual Configuration</h2>
        <p class="lede">Object-centred access to the complete vSphere configuration captured by VCFexport. Select an object to see its properties, child datasets, and related infrastructure.</p>
        <div class="config-toolbar">
          <div class="control"><label for="config-type">Object type</label><select id="config-type"></select></div>
